<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>检查番号二维码生成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .search-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
        }

        .form-group {
            display: inline-block;
            margin-right: 20px;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 250px;
        }

        .btn {
            padding: 8px 24px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:hover {
            background: #40a9ff;
        }

        .qr-grid {
            display: block;
            margin-top: 20px;
        }

        .label-wrapper {
            display: block;
            margin: 10px auto;
            text-align: center;
            max-width: 165mm;
        }

        .qr-row {
            padding: 0;
            border: 1px solid #ccc;
            background-color: #ffd800;
            width: 65mm;
            min-height: 48mm;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            display: inline-block;
        }

        .qr-row.printed {
            border-color: #52c41a;
            background-color: #d9f7be;
        }

        .label-content {
            padding: 6px;
            height: 100%;
            box-sizing: border-box;
        }

        .label-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .label-table td {
            padding: 2px;
            vertical-align: top;
        }

        .header-info {
            font-size: 14px;
            line-height: 18px;
            font-weight: bold;
        }

        .barcode-cell {
            vertical-align: top;
            text-align: left;
            width: 100px;
        }

        .qr-code-container {
            width: 100px;
            height: 100px;
            margin: 0;
            text-align: center;
        }

        .dimensions-table {
            width: 110px;
            font-size: 11px;
        }

        .dimensions-table td {
            padding: 1px 3px;
            white-space: nowrap;
        }

        .seq-info {
            font-size: 14px;
            line-height: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .footer-text {
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 9px;
            color: #333;
        }

        .print-btn {
            margin-top: 8px;
            padding: 8px 24px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 22px;
            cursor: pointer;
            margin-right: 5px;
        }

        .preview-btn {
            margin-top: 8px;
            padding: 8px 24px;
            background: #52c41a;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 22px;
            cursor: pointer;
        }

        .print-btn:hover {
            background: #40a9ff;
        }

        .preview-btn:hover {
            background: #73d13d;
        }

        .print-btn:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }

        .qr-info {
            font-size: 12px;
            color: #666;
            line-height: 1.8;
        }

        .qr-info div {
            margin: 3px 0;
        }

        .qr-info strong {
            color: #333;
            display: inline-block;
            width: 70px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                padding: 10px;
            }

            .search-section,
            .btn {
                display: none !important;
            }

            .label-wrapper {
                page-break-inside: avoid;
                margin: 5mm;
            }

            .qr-row {
                border: 1px solid #000;
            }

            .print-btn {
                display: none !important;
            }

            .preview-btn {
                display: none !important;
            }

            .qr-row.printed {
                border-color: #000;
                background-color: #ffd800 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>检查番号二维码生成</h1>
        <input type="hidden" id="txtChkNo" />
        <!-- 结果区域 -->
        <div id="resultSection" style="display: none;">
            <div id="qrGrid" class="qr-grid"></div>
        </div>

        <!-- 加载提示 -->
        <div class="loading" id="loading" style="display: none;">加载中...</div>

        <!-- 错误提示 -->
        <div class="error" id="errorMsg" style="display: none;"></div>
    </div>

    <!-- 引入 jQuery 1.x (兼容 IE10) -->
    <script src="Jquery/jquery-3.6.0.min.js"></script>
    <!-- 引入 QRCode.js 库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <!-- 引入自定义 JS -->
    <script src="printLinesCodeRelation.js?ver=1.01"></script>
</body>
</html>
